[/Script/UnrealMCPServer.UMCPSettings]
ServerPort=13579
bAutoStartServer=True
bVerboseLogging=False
MaxRequestsPerMinute=120

; --- v4: tool exposure (Catalog = meta-tools + ~30 core, ~95% less agent context;
; Full = every tool up front). Per-request override: tools/list {"exposure": "full"} ---
ToolExposureMode=Catalog

; --- Hardening guards (v4) ---
MaxRequestSizeMB=8
ToolCallTimeoutSeconds=60
SessionIdleTimeoutMinutes=30

; --- Authentication / CORS / WebSocket (Phase B / v3) ---
bRequireAuthToken=False
bAllowDestructiveScope=False
bEnableWebSocket=False
+AllowedOrigins=http://localhost
+AllowedOrigins=http://127.0.0.1
